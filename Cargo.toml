[workspace]
members = [
    "liquid-agent",
    "liquid-api",
    "liquid-cli",
    "liquid-config",
    "liquid-core",
    "liquid-llm",
    "liquid-sql",
    "liquid-storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "AI audit and observability layer for databases, helping teams understand, review, and monitor SQL from local development to production Postgres."
license = "MIT"
repository = "https://github.com/zhubby/liquid"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
liquid-agent = { path = "liquid-agent" }
liquid-api = { path = "liquid-api" }
liquid-config = { path = "liquid-config" }
liquid-core = { path = "liquid-core" }
liquid-llm = { path = "liquid-llm" }
liquid-sql = { path = "liquid-sql" }
liquid-storage = { path = "liquid-storage" }
pg_query = "6"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "macros", "time"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
tokio = { version = "1.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0", features = ["serde-json-impl", "format"] }
