name: Publish Docker Images

on:
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: image-owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/liquid:${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=liquid
          cache-to: type=gha,mode=max,scope=liquid

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./liquid-ui
          file: ./liquid-ui/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/liquid-ui:${{ github.event.release.tag_name }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=liquid-ui
          cache-to: type=gha,mode=max,scope=liquid-ui
