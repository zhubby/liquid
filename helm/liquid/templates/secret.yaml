{{- include "liquid.validateDatabase" . -}}
{{- $createSecret := or (not .Values.secrets.existingSecret) (not .Values.database.existingSecret) .Values.llm.openaiApiKey -}}
{{- if $createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liquid.secretName" . }}
  labels:
    {{- include "liquid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.existingSecret }}
  {{ .Values.secrets.encryptionKeyKey }}: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  database-url: {{ include "liquid.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.llm.openaiApiKey }}
  openai-api-key: {{ .Values.llm.openaiApiKey | quote }}
  {{- end }}
{{- end }}
