apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liquid.configName" . }}
  labels:
    {{- include "liquid.labels" . | nindent 4 }}
data:
  LIQUID_API_ADDR: {{ printf "0.0.0.0:%v" .Values.backend.containerPort | quote }}
  LIQUID_CORS_ORIGIN: {{ .Values.backend.corsOrigin | quote }}
  LIQUID_DATABASE_MAX_CONNECTIONS: {{ .Values.backend.databaseMaxConnections | quote }}
  LIQUID_DATABASE_AUTO_MIGRATE: {{ .Values.backend.databaseAutoMigrate | quote }}
  LIQUID_AUTH_TOKEN_TTL_SECONDS: {{ .Values.backend.authTokenTtlSeconds | quote }}
  LIQUID_SQL_METADATA: {{ .Values.backend.sqlMetadata | quote }}
  LIQUID_SQL_EXECUTION: {{ .Values.backend.sqlExecution | quote }}
  LIQUID_SQL_MANAGED_POOL_MAX_CONNECTIONS: {{ .Values.backend.managedPool.maxConnections | quote }}
  LIQUID_SQL_MANAGED_POOL_IDLE_TTL_SECONDS: {{ .Values.backend.managedPool.idleTtlSeconds | quote }}
  LIQUID_SQL_MANAGED_POOL_REAP_INTERVAL_SECONDS: {{ .Values.backend.managedPool.reapIntervalSeconds | quote }}
  LIQUID_SQL_MANAGED_POOL_ACQUIRE_TIMEOUT_SECONDS: {{ .Values.backend.managedPool.acquireTimeoutSeconds | quote }}
  LIQUID_WORKBENCH_MAX_TOOL_ROUNDS: {{ .Values.backend.workbench.maxToolRounds | quote }}
  LIQUID_WORKBENCH_MAX_OUTPUT_TOKENS: {{ .Values.backend.workbench.maxOutputTokens | quote }}
  LIQUID_BACKUP_S3_BUCKET: {{ .Values.backup.s3Bucket | quote }}
  LIQUID_BACKUP_S3_PREFIX: {{ .Values.backup.s3Prefix | quote }}
  LIQUID_BACKUP_S3_REGION: {{ .Values.backup.s3Region | quote }}
  LIQUID_BACKUP_S3_ENDPOINT: {{ .Values.backup.s3Endpoint | quote }}
  LIQUID_BACKUP_S3_PATH_STYLE: {{ .Values.backup.s3PathStyle | quote }}
  LIQUID_BACKUP_WORK_DIR: {{ .Values.backup.workDir | quote }}
  LIQUID_BACKUP_WORKER_CONCURRENCY: {{ .Values.backup.workerConcurrency | quote }}
  OPENAI_BASE_URL: {{ .Values.llm.openaiBaseUrl | quote }}
  OPENAI_MODEL: {{ .Values.llm.openaiModel | quote }}
  OPENAI_API_MODE: {{ .Values.llm.openaiApiMode | quote }}
