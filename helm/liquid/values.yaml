# Default values for Liquid.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

secrets:
  # Use an existing Secret for LIQUID_ENCRYPTION_KEY and optionally OPENAI_API_KEY.
  existingSecret: ""
  encryptionKey: "replace-with-a-secret-key"
  encryptionKeyKey: "liquid-encryption-key"
  openaiApiKeyKey: "openai-api-key"

database:
  # Use an existing Secret containing a full PostgreSQL URL. This is the safest
  # production option when passwords contain URL-reserved characters.
  existingSecret: ""
  existingSecretKey: "database-url"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: liquid
    password: liquid
    database: liquid
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalDatabase:
  enabled: false
  host: ""
  port: 5432
  username: liquid
  password: ""
  database: liquid
  sslMode: ""

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/zhubby/liquid
    pullPolicy: IfNotPresent
    tag: ""
  containerPort: 3001
  service:
    type: ClusterIP
    port: 3001
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: liquid-api.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null
  waitForDatabase:
    enabled: true
  corsOrigin: "http://localhost:3000"
  databaseMaxConnections: 5
  databaseAutoMigrate: true
  authTokenTtlSeconds: 604800
  sqlMetadata: auto
  sqlExecution: readonly
  managedPool:
    maxConnections: 2
    idleTtlSeconds: 600
    reapIntervalSeconds: 60
    acquireTimeoutSeconds: 10
  workbench:
    maxToolRounds: 12
    maxOutputTokens: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  resources: {}
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/zhubby/liquid-ui
    pullPolicy: IfNotPresent
    tag: ""
  containerPort: 3000
  # Set to the browser-reachable API URL, for example https://api.example.com.
  # The published Next.js image may also have this value baked at build time.
  apiBaseUrl: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: liquid.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
  resources: {}
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

llm:
  openaiApiKey: ""
  openaiBaseUrl: "https://api.openai.com"
  openaiModel: ""
  openaiApiMode: chat_completions

backup:
  s3Bucket: ""
  s3Prefix: liquid/database-backups
  s3Region: us-east-1
  s3Endpoint: ""
  s3PathStyle: false
  workDir: /home/liquid/.liquid/backup
  workerConcurrency: 1
