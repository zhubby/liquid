apiVersion: v1
kind: Service
metadata:
  name: {{ include "liquid.backendFullname" . }}
  labels:
    {{- include "liquid.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "liquid.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
